
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OctopusMine</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #061827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.card {
  background: #102d40;
  padding: 20px;
  margin: 15px 0;
  border-radius: 15px;
}
h1 { color: #45d8e7; }
.coins {
  font-size: 35px;
  color: #45d8e7;
  font-weight: bold;
}
button {
  background: #00aebd;
  color: white;
  border: 0;
  padding: 14px;
  width: 100%;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 10px;
}
button:disabled {
  background: #526773;
}
#timer {
  color: #45d8e7;
  margin-top: 15px;
}
</style>
</head>
<body>

<h1>🐙 OctopusMine</h1>
<p>Welcome to OctopusMine!</p>

<div class="card">
  <p>YOUR DEMO BALANCE</p>
  <div class="coins" id="coins">0</div>
  <p>Demo Coins</p>
</div>

<div class="card">
  <h3>⛏️ Start Mining</h3>
  <p id="status">Ready to start mining!</p>
  <button id="mine" onclick="startMining()">START MINING</button>
  <p id="timer">Earn 60 demo coins every 2 hours</p>
</div>

<div class="card">
  <h3>📺 Video Ads</h3>
  <p>Video ad feature coming soon.</p>
</div>

<div class="card">
  <h3>🖼️ Banner Ads</h3>
  <p>Banner ad feature coming soon.</p>
</div>

<div class="card">
  <h3>👥 Referral</h3>
  <button onclick="shareReferral()">SHARE REFERRAL</button>
</div>

<div class="card">
  <h3>👤 Account</h3>
  <button onclick="alert('Demo balance only. No real withdrawal.')">My Balance</button>
  <button onclick="alert('Demo history coming soon.')">History</button>
</div>

<script>
let coins = Number(localStorage.getItem('octopus_coins')) || 0;

// Reset the old mining timer only once
if (!localStorage.getItem('octopus_timer_reset_v2')) {
  localStorage.setItem('octopus_mining', '0');
  localStorage.setItem('octopus_timer_reset_v2', '1');
}

let mining = Number(localStorage.getItem('octopus_mining')) || 0;

// Real demo duration: 2 hours
const duration = 2 * 60 * 60 * 1000;

function update() {
  let remaining = duration - (Date.now() - mining);

  if (mining && remaining > 0) {
    document.getElementById('mine').disabled = true;
    document.getElementById('status').textContent =
      'Mining in progress...';

    let h = Math.floor(remaining / 3600000);
    let m = Math.floor(remaining % 3600000 / 60000);
    let s = Math.floor(remaining % 60000 / 1000);

    document.getElementById('timer').textContent =
      'Time left: ' + h + 'h ' + m + 'm ' + s + 's';

  } else {
    if (mining) {
      coins += 60;
      localStorage.setItem('octopus_coins', coins);
      localStorage.setItem('octopus_mining', '0');
      mining = 0;
    }

    document.getElementById('mine').disabled = false;
    document.getElementById('status').textContent =
      'Ready to start mining!';

    document.getElementById('timer').textContent =
      'Earn 60 demo coins every 2 hours';
  }

  document.getElementById('coins').textContent = coins;
}

function startMining() {
  if (mining) return;

  mining = Date.now();
  localStorage.setItem('octopus_mining', mining);
  update();
}

function shareReferral() {
  let url = window.location.href;

  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.openTelegramLink(
      'https://t.me/share/url?url=' +
      encodeURIComponent(url) +
      '&text=' +
      encodeURIComponent('Join OctopusMine!')
    );
  } else {
    alert('Open this app inside Telegram to share.');
  }
}

update();
setInterval(update, 1000);

if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}
</script>

</body>
</html>
